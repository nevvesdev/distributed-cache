services:
  redis:
    image: redis:7.4-alpine
    container_name: distributed-cache-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - distributed-cache-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: distributed-cache-postgres
    environment:
      POSTGRES_DB: distributed_cache
      POSTGRES_USER: dcache
      POSTGRES_PASSWORD: dcache
    ports:
      - "5432:5432"
    volumes:
      - distributed-cache-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcache -d distributed_cache"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: distributed-cache:local
    container_name: distributed-cache-app
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/distributed_cache
      DB_USER: dcache
      DB_PASSWORD: dcache
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  distributed-cache-redis-data:
  distributed-cache-postgres-data:
