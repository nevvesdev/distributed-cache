spring:
  application:
    name: distributed-cache
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/distributed_cache}
    username: ${DB_USER:dcache}
    password: ${DB_PASSWORD:dcache}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: distributed-cache
    description: Serviço de consulta de saldo e limite com cache distribuído Redis (Cache-Aside)

dcache:
  cache:
    enabled: true
    ttl: 5m
